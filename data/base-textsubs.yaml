    # Commas when dealing with coins
    - name: 'coin commas with platinum grouping'
      when:
        setting: 'textsubs_use_plat_grouping'
      requires_any: ['Kronar', 'Dokora', 'Lirum']
      subs:
        - ['(?!.*>)\d{1,3}(?=((\d{3})*(\d{4}))(?!\d)(?! platinum).*(Kronar|Dokora|Lirum))', '\&,']
        - ['(?!.*>)\d{1,3}(?=(\d{3})+(?!\d) platinum.*(Kronar|Dokora|Lirum))', '\&,']

    - name: 'coin commas'
      when:
        setting_off: 'textsubs_use_plat_grouping'
      requires_any: ['Kronar', 'Dokora', 'Lirum']
      subs:
        - ['(?!.*>)\d{1,3}(?=(\d{3})+(?!\d).*(Kronar|Dokora|Lirum))', '\&,']

