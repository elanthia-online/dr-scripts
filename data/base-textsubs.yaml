    - name: 'Trader'
      when:
        guilds: ['Trader']
      subs:
        - ['The smallest hint of starlight flickers within your aura.', 'The smallest hint of starlight flickers within your aura (0/9).']
        - ['A bare flicker of starlight plays within your aura.', 'A bare flicker of starlight plays within your aura (1/9).']
        - ['A faint amount of starlight illuminates your aura.', 'A faint amount of starlight illuminates your aura (2/9).']
        - ['Your aura pulses slowly with starlight.', 'Your aura pulses slowly with starlight (3/9).']
        - ['A steady pulse of starlight runs through your aura.', 'A steady pulse of starlight runs through your aura (4/9).']
        - ['Starlight dances vividly across the confines of your aura.', 'Starlight dances vividly across the confines of your aura (5/9).']
        - ['Strong pulses of starlight flare within your aura.', 'Strong pulses of starlight flare within your aura (6/9).']
