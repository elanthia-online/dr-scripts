    # Bard play and dance assessment (the song ladder is the later Bard block)
    - name: 'Bard play and dance assessment'
      when:
        guilds: ['Bard']
      subs:
        - ['the simplest musical phrase in your current state of mind.', 'the simplest musical phrase in your current state of mind. (1/10)']
        - ['feel very sure of your ability to perform just now.', 'feel very sure of your ability to perform just now. (2/10)']
        - ['you give up in exasperation and stop trying to play altogether.', 'you give up in exasperation and stop trying to play altogether. (3/10)']
        - ['you realize that you''re not quite up to a true performance.', 'you realize that you''re not quite up to a true performance. (4/10)']
        - ['produced from your efforts is both clear and precise.', 'produced from your efforts is both clear and precise. (5/10)']
        - ['displaying the surety you hold in your ability to perform.', 'displaying the surety you hold in your ability to perform. (6/10)']
        - ['adeptness with which you perform your craft is evident in each movement.', 'adeptness with which you perform your craft is evident in each movement. (7/10)']
        - ['skill and confidence of one talented in their craft.', 'skill and confidence of one talented in their craft. (8/10)']
        - ['evocative rhythms you send to float gently upon the air.', 'evocative rhythms you send to float gently upon the air. (9/10)']
        - ['Leth Deriel during the full throes of Spring.', 'Leth Deriel during the full throes of Spring. (10/10)']
        - ['you decide not to attempt that again, and get back to your feet.', 'you decide not to attempt that again, and get back to your feet. (1/10)']
        - ['but decide that now may not be the best time for dancing.', 'but decide that now may not be the best time for dancing. (2/10)']
        - ['You can''t seem to recall what to do next, despite your best efforts.', 'You can''t seem to recall what to do next, despite your best efforts. (3/10)']
        - ['entirety of the dance without too much trouble.', 'entirety of the dance without too much trouble. (4/10)']
        - ['dance flawlessly, wrapping up with a flourish.', 'dance flawlessly, wrapping up with a flourish. (5/10)']
        - ['leave you breathless, you wrap up with a flourish.', 'leave you breathless, you wrap up with a flourish. (6/10)']
        - ['reaches its conclusion, a grin lights up your face.', 'reaches its conclusion, a grin lights up your face. (7/10)']
        - ['and when they finally come to rest again, you cannot help but smile.', 'and when they finally come to rest again, you cannot help but smile. (8/10)']
        - ['When you finally come to rest again, you are still smiling.', 'When you finally come to rest again, you are still smiling. (9/10)']
        - ['you wrap up with a flourish and pose, a wide smile upon your face.', 'you wrap up with a flourish and pose, a wide smile upon your face. (10/10)']

