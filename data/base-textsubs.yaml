        - ['a brilliant aura of beautiful flames extending nearly twice your height above your body', 'a brilliant aura of beautiful flames extending nearly twice your height above your body (12/13)']
        - ['a brilliant aura of pristine quality burning outward at twice your height', 'a brilliant aura of pristine quality burning outward at twice your height (13/13)']

    # Commas when dealing with coins
    - name: 'coin commas with platinum grouping'
      when:
        setting: 'textsubs_use_plat_grouping'
      requires_any: ['Kronar', 'Dokora', 'Lirum']
      subs:
        - ['(?!.*>)\d{1,3}(?=((\d{3})*(\d{4}))(?!\d)(?! platinum).*(Kronar|Dokora|Lirum))', '\&,']
        - ['(?!.*>)\d{1,3}(?=(\d{3})+(?!\d) platinum.*(Kronar|Dokora|Lirum))', '\&,']

    - name: 'coin commas'
      when:
        setting_off: 'textsubs_use_plat_grouping'
      requires_any: ['Kronar', 'Dokora', 'Lirum']
      subs:
        - ['(?!.*>)\d{1,3}(?=(\d{3})+(?!\d).*(Kronar|Dokora|Lirum))', '\&,']

