        - ['^Taking silent stock of your connection to the natural world, you feel your connection to the wilds wavering slightly.', 'Taking silent stock of your connection to the natural world, you feel your connection to the wilds wavering slightly. (11/15)']
        - ['^Taking silent stock of your connection to the natural world, you feel a strain in your connection to the wilds.', 'Taking silent stock of your connection to the natural world, you feel a strain in your connection to the wilds. (10/15)']
        - ['^Taking silent stock of your connection to the natural world, you feel unsure of yourself.', 'Taking silent stock of your connection to the natural world, you feel unsure of yourself. (9/15)']
        - ['^Taking silent stock of your connection to the natural world, you feel like a lost wolf looking for its pack.', 'Taking silent stock of your connection to the natural world, you feel like a lost wolf looking for its pack. (8/15)']
        - ['^Taking silent stock of your connection to the natural world, you feel desolate and not quite right.', 'Taking silent stock of your connection to the natural world, you feel desolate and not quite right. (7/15)']
        - ['^Taking silent stock of your connection to the natural world, you feel choked by the clutches of civilization.', 'Taking silent stock of your connection to the natural world, you feel choked by the clutches of civilization. (6/15)']
