    # Barbarian inner fire levels
    - name: 'Barbarian inner fire'
      when:
        guilds: ['Barbarian']
      subs:
        - ['a dim glow as if a flame lurked just out of sight', 'a dim glow as if a flame lurked just out of sight (1/13)']
        - ['a tiny aura of beautiful flames', 'a tiny aura of beautiful flames (2/13)']
        - ['a small aura of beautiful flames', 'a small aura of beautiful flames (3/13)']
        - ['a bright aura of beautiful flames\.', 'a bright aura of beautiful flames (4/13).']
        - ['a bright aura of beautiful flames extending a quarter of your height above you', 'a bright aura of beautiful flames extending a quarter of your height above you (5/13)']
        - ['a bright aura of beautiful flames extending out around you just beyond the reach of your arms', 'a bright aura of beautiful flames extending out around you just beyond the reach of your arms (6/13)']
        - ['a brilliant aura of beautiful flames extending out around you about half again your height', 'a brilliant aura of beautiful flames extending out around you about half again your height (7/13)']
