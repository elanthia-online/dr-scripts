    # Ranger pace messaging substitutions, these show the wilderness level of the room so you can determine how much the room will raise or decrease your bonus.
    # Neutral messaging is purposefully not reported here because non-rangers would see it.
    - name: 'Ranger pace'
      when:
        guilds: ['Ranger']
      subs:
        - ['You glance about the area while pacing back and forth, like a large, stalking mountain cat\.', 'You glance about the area while pacing back and forth, like a large, stalking mountain cat. (extremely wilderness)']
        - ['You glide around the area like a crocodile, truly in your element\.', 'You glide around the area like a crocodile, truly in your element. (moderately wilderness)']
        - ['You pace back and forth, smiling slightly to yourself at the refreshing familiarity of the area\.', 'You pace back and forth, smiling slightly to yourself at the refreshing familiarity of the area. (moderately wilderness)']
        - ['You pace back and forth, scowling slightly at your surroundings\.', 'You pace back and forth, scowling slightly at your surroundings. (moderately urban)']
        - ['You pace back and forth like a trapped animal\.', 'You pace back and forth like a trapped animal. (extremely urban)']
        - ['^You take in a deep breath to howl, and let loose with a mighty\.\.\. Moo\?!  The sounds that erupt from within you sound startlingly like the loud bleating of a young heifer giving birth to her first calf\.', 'You take in a deep breath to howl, and let loose with a mighty... Moo?!  The sounds that erupt from within you sound startlingly like the loud bleating of a young heifer giving birth to her first calf. (1/15)']
