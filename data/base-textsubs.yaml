    # Appraise focus progress levels
    - name: 'appraise focus progress'
      kind: 'ladder'
      anchor: '^'
      prefix: 'You feel like'
      of: 4
      steps:
        - [1, 'it will be awhile before you make progress\.']
        - [2, 'you have made some progress toward your goal\.']
        - [3, 'you''ve made good progress toward your goal\.']
        - [4, 'you are on the verge of learning something useful\.']

    - name: 'hit tiers, harmless and glancing'
      subs:
        - ['(a|an) (benign|brushing|gentle|grazing|harmless|ineffective|skimming) (blow|hit|strike)', '\1 \2 (0/23) \3']
        # correction for bad glancing blow label receiving a glancing (0/23) blow
        - ['(?<!receiving )(a|an) (glancing) (blow|hit|strike)', '\1 \2 (0/23) \3']

    - name: 'hit tiers'
      kind: 'ladder'
      scale: 'hit tiers'
      of: 23
      steps:
        - [1, 'a light hit']
        - [2, 'a good hit']
        - [3, 'a good strike']
        - [4, 'a solid hit']
        - [5, 'a hard hit']
        - [6, 'a strong hit']
        - [7, 'a heavy strike']
        - [8, 'a very heavy hit']
        - [9, 'an extremely heavy hit']
        - [10, 'a powerful strike']
        - [11, 'a massive strike']
        - [12, 'an awesome strike']
        - [13, 'a vicious strike']
        - [14, 'an earth-shaking strike']
        - [15, 'a demolishing hit']
        - [16, 'a spine-rattling strike']

    - name: 'hit tiers, devastating without a mark'
      subs:
        - ['a devastating hit(?! \(That''ll leave a mark!\))', 'a devastating hit (17/23)']

    - name: 'hit tiers, leaving a mark and worse'
      kind: 'ladder'
      scale: 'hit tiers'
      of: 23
      steps:
        - [18, 'a devastating hit \(That''ll leave a mark!\)']
        - [19, 'an overwhelming strike']
        - [20, 'an obliterating hit']
        - [21, 'an annihilating strike']
        - [22, 'a cataclysmic strike']
        - [23, 'an apocalyptic strike']

    # mana tuners
    - name: 'mana tuners'
      when:
        not_guilds: ['Barbarian', 'Thief', 'Moon Mage', 'Trader']
      subs:
        - ['streams of cold, white mana chill your core.', 'streams of cold, white mana chill your core. (Lunar)']
        - ['streams of fiery mana burn through your limbs.', 'streams of fiery mana burn through your limbs. (Elemental)']
        - ['streams of bluish-white mana flow up your spine.', 'streams of bluish-white mana flow up your spine. (Life)']
        - ['streams of golden mana echo through your body.', 'streams of golden mana echo through your body. (Holy)']
        - ['streams of unholy black mana leave you feeling feverish.', 'streams of unholy black mana leave you feeling feverish. (Arcane)']

    - name: 'Cleric devotion'
      when:
        guilds: ['Cleric']
      kind: 'ladder'
      anchor: '^'
      of: 16
      steps:
        - [1, 'You feel unclean and unworthy\.']
        - [2, 'You close your eyes and start to concentrate\. In a moment a vision appears of a barren garden, parched and thirsting for nourishment\. You have an intense desire to tend it\.']
        - [3, 'You call out to your god, but there is no answer\.']
        - [4, 'After a moment, you sense that your god is barely aware of you\.']
        - [5, 'After a moment, you sense that your efforts have not gone unnoticed\.']
        - [6, 'After a moment, you sense a distinct link between you and your god\.']
        - [7, 'After a moment, you sense that your god is aware of your devotion\.']
        - [8, 'After a moment, you sense that your god is pleased with your devotion\.']
        - [9, 'After a moment, you sense that your god knows your name\.']
        - [10, 'After a moment, you see a vision of your god, though the visage is cloudy and impossible to make out clearly\.']
        - [11, 'After a moment, you sense a slight pressure on your shoulder, leaving the feeling that your efforts have been acknowledged\.']
        - [12, 'After a moment, you see a silent vision of your god, radiating forth with a powerful divine brilliance\.']
        - [13, 'After a moment, you see a vision of your god who calls to you by name, "Come here, my child, and I will show you things of wonder\."']
        - [14, 'After a moment, you see a vision of your god who calls to you by name, "My child, though you may not always see my face, I am pleased with thee and thy efforts\."']

    - name: 'Cleric devotion, clear vision and presence'
      when:
        guilds: ['Cleric']
      subs:
        - ['^After a moment, you see a crystal-clear vision of your god who speaks slowly and deliberately, "Your unwavering faith and devotion pleases me greatly, (\w+)\.\s+Go forth and continue your works, and you shall only attain a greater level of purity\."', 'After a moment, you see a crystal-clear vision of your god who speaks slowly and deliberately, "Your unwavering faith and devotion pleases me greatly, \1.  Go forth, and continue your works and you shall only attain a greater level of purity." (15/16)']
        # The game writes sana'ati lowercase in common text and capitalised in a
