    # Bard song assessment: one key per whole message, so each gets one counter
    - name: 'Bard song assessment'
      when:
        guilds: ['Bard']
      subs:
        - ['You stop only after those first few lines, however, unable to remember any more\.', 'You stop only after those first few lines, however, unable to remember any more (1/7).']
        - ['Your voice cracks on the second line, however, and you stop, unable to remember any more of the song anyway\.', 'Your voice cracks on the second line, however, and you stop, unable to remember any more of the song anyway (1/7).']
        - ['At one point you hesitate as you mentally grasp for the next line of the song, and stop in confusion, but pick it up a moment later and bring it to a strong conclusion\.', 'At one point you hesitate as you mentally grasp for the next line of the song, and stop in confusion, but pick it up a moment later and bring it to a strong conclusion (2/7).']
        - ['You feel a bit tired as you finish, but grin despite that for the ease at which you sang\.', 'You feel a bit tired as you finish, but grin despite that for the ease at which you sang (3/7).']
        - ['You bring the song to a close, bowing your head\.', 'You bring the song to a close, bowing your head (4/7).']
