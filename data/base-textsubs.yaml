    # Ranger pace messaging substitutions, these show the wilderness level of the room so you can determine how much the room will raise or decrease your bonus.
    # Neutral messaging is purposefully not reported here because non-rangers would see it.
    - name: 'Ranger pace'
      when:
        guilds: ['Ranger']
      subs:
        - ['You glance about the area while pacing back and forth, like a large, stalking mountain cat\.', 'You glance about the area while pacing back and forth, like a large, stalking mountain cat. (extremely wilderness)']
        - ['You glide around the area like a crocodile, truly in your element\.', 'You glide around the area like a crocodile, truly in your element. (moderately wilderness)']
        - ['You pace back and forth, smiling slightly to yourself at the refreshing familiarity of the area\.', 'You pace back and forth, smiling slightly to yourself at the refreshing familiarity of the area. (moderately wilderness)']
        - ['You pace back and forth, scowling slightly at your surroundings\.', 'You pace back and forth, scowling slightly at your surroundings. (moderately urban)']
        - ['You pace back and forth like a trapped animal\.', 'You pace back and forth like a trapped animal. (extremely urban)']
        - ['^You take in a deep breath to howl, and let loose with a mighty\.\.\. Moo\?!  The sounds that erupt from within you sound startlingly like the loud bleating of a young heifer giving birth to her first calf\.', 'You take in a deep breath to howl, and let loose with a mighty... Moo?!  The sounds that erupt from within you sound startlingly like the loud bleating of a young heifer giving birth to her first calf. (1/15)']
        - ['^You open your mouth to howl, but it sounds more like a dying chicken than anything else\.', 'You open your mouth to howl, but it sounds more like a dying chicken than anything else. (2/15)']
        - ['^You give forth a mighty\.\.\. yelp, which sounds more like a domesticated puppy than anything else\.', 'You give forth a mighty... yelp, which sounds more like a domesticated puppy than anything else. (3/15)']
        - ['^You open your mouth and roar with everything you''ve got!  A few soft sounds reminiscent of a baby robin''s first song twitter sweetly from within you\.(?=\r?$)', 'You open your mouth and roar with everything you''ve got!  A few soft sounds reminiscent of a baby robin''s first song twitter sweetly from within you. (4/15)']
        - ['^You open your mouth to howl, but you merely sigh like the softest wind through the trees\.(\s+)Sadly, not even a leaf flutters with your "mighty" breath\.', 'You open your mouth to howl, but you merely sigh like the softest wind through the trees.\1Sadly, not even a leaf flutters with your "mighty" breath. (5/15)']
        - ['^You take in a deep breath to howl loudly, but instead cough and choke on the air around you\.', 'You take in a deep breath to howl loudly, but instead cough and choke on the air around you. (6/15)']
        - ['^You howl quietly to yourself, echoing a soft, desolate sound that doesn''t sound quite right\.(?=\r?$)', 'You howl quietly to yourself, echoing a soft, desolate sound that doesn''t sound quite right. (7/15)']
        - ['^You take in a deep breath to howl, but it comes out as a whimper, like a lost wolf looking for his pack\.', 'You take in a deep breath to howl, but it comes out as a whimper, like a lost wolf looking for his pack. (8/15)']
        - ['^You howl meekly, unsure of yourself\.', 'You howl meekly, unsure of yourself. (9/15)']
        - ['^You take in a deep breath of air and howl softly\.', 'You take in a deep breath of air and howl softly. (10/15)']
        - ['^You open your mouth and throw back your head, howling with a tentative but fairly resonant tone that wavers only slightly\.', 'You open your mouth and throw back your head, howling with a tentative but fairly resonant tone that wavers only slightly. (11/15)']
        - ['^You howl like a wolf calling the pack!', 'You howl like a wolf calling the pack! (12/15)']
        - ['^You inhale and howl strongly, the cacophonous sounds reverberating around you\.', 'You inhale and howl strongly, the cacophonous sounds reverberating around you. (13/15)']
        - ['^You howl strongly, like that of a wolf calling its kin to assemble for a hunt\.(\s+)The sound echoes commandingly through the area\.', 'You howl strongly, like that of a wolf calling its kin to assemble for a hunt.\1The sound echoes commandingly through the area. (14/15)']
        - ['^You inhale deeply, a resounding howl breaking forth from within you, resonating strongly into the distance as if to announce your mastery of the wilds!', 'You inhale deeply, a resounding howl breaking forth from within you, resonating strongly into the distance as if to announce your mastery of the wilds! (15/15)']
        - ['^Taking silent stock of your connection to the natural world, you feel like a true master of the wilds!', 'Taking silent stock of your connection to the natural world, you feel like a true master of the wilds! (15/15)']
        - ['^Taking silent stock of your connection to the natural world, you feel in command of the wilds.', 'Taking silent stock of your connection to the natural world, you feel in command of the wilds. (14/15)']
        - ['^Taking silent stock of your connection to the natural world, you feel strongly connected to the wilds.', 'Taking silent stock of your connection to the natural world, you feel strongly connected to the wilds. (13/15)']
