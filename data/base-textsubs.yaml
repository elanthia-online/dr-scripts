        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) particularly weak against damage', 'Assessing the \1 durability, \2 particularly weak (5/18) against damage']
        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) somewhat unsound against damage', 'Assessing the \1 durability, \2 somewhat unsound against damage (6/18)']
        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) appreciably susceptible to damage', 'Assessing the \1 durability, \2 appreciably susceptible to damage (7/18)']
        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) marginally vulnerable to damage', 'Assessing the \1 durability, \2 marginally vulnerable to damage (8/18)']
        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) of average construction', 'Assessing the \1 durability, \2 of average construction (9/18)']
        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) a bit safeguarded against damage', 'Assessing the \1 durability, \2 a bit safeguarded against damage (10/18)']
        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) rather reinforced against damage', 'Assessing the \1 durability, \2 rather reinforced against damage (11/18)']
