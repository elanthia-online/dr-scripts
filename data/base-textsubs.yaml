        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) extremely weak and easily damaged', 'Assessing the \1 durability, \2 extremely weak and easily damaged (1/18)']
        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) very delicate and easily damaged', 'Assessing the \1 durability, \2 very delicate and easily damaged (2/18)']
        - ['Assessing the (.*) durability, you determine (it is|is|they are|are) quite fragile and easily damaged', 'Assessing the \1 durability, \2 quite fragile and easily damaged (3/18)']
