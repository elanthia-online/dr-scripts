        - ['Rolagi', 'Rolagi (Crossing)']
        - ['Asharshpar''i', 'Asharshpar''i (Leth Deri''el)']
        - ['Dinegavren', 'Dinegavren (Therenborough)']
        - ['Mintais', 'Mintais (Throne City)']
        - ['Tamigen', 'Tamigen (Raven''s Point)']
        - ['Taniendar', 'Taniendar (Riverhaven)']
        - ['Erekinzil', 'Erekinzil (Taisgath)']
        - ['Auilusi', 'Auilusi (Aesry Surlaenis''a)']
        - ['Vellano', 'Vellano (Fang Cove)']
        - ['Tabelrem', 'Tabelrem (Muspar''i)']
        - ['Dor''na''torna', 'Dor''na''torna (Arid Steppe)']
        - ['Besoge', 'Besoge (Mer''kresh)']
        - ['Aevargwem', 'Aevargwem (Vela''Tohr Overlook)']

    - name: 'herb areas'
      when:
        setting: 'herb_textsubs'
      subs:
        - ['nilos', 'nilos (abdo-EW)']
        - ['muljin', 'muljin (abdo-IW)']
        - ['dioica', 'dioica (gen-ES)']
