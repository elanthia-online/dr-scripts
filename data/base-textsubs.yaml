        - ['aloe', 'aloe (skin-EW)']
        - ['genich', 'genich (body-ES)']
        - ['ojhenik', 'ojhenik (body-IS)']

    # Social Outrage and Divine Outrage
    - name: 'outrage, durability, appraisal and combat'
      subs:
        - ['The citizens of (.*) are growing suspicious of you\.', 'The citizens of \1 are growing suspicious of you. (1/4 - Can still use town services.)']
        - ['it is widely believed that you are some kind of sorcerer\.', 'it is widely believed that you are some kind of sorcerer. (2/4 - Unable to use most town services. WITHDRAW, SELL, PAY, TRAIN and GET SACK are safe.)']
        - ['is criminal and the government actively seeks to arrest you\.', 'is criminal and the government actively seeks to arrest you. (3/4 - Unable to use most town services and can be auto-arrested at gates. WITHDRAW, SELL, PAY, TRAIN and GET SACK are safe.)']
        - ['You are regarded as a monster by the good folk of (.*)\.', 'You are regarded as a monster by the good folk of \1. (4/4 - Unable to use most town services, can be auto-arrested at gates, and posse may hunt you down in province. WITHDRAW, SELL, PAY, TRAIN and GET SACK are safe.)']
        - ['You feel as if many eyes are judging you and still find you... lacking\.', 'You feel as if many eyes are judging you and still find you... lacking. (0/4 - You are still Redeemed.)']
        - ['As though in response, you are struck by a feeling of insecurity\.', 'As though in response, you are struck by a feeling of insecurity. (1/4 - Low DO)']
        - ['As though in response, you have a brief, sharp pain in your limbs\.', 'As though in response, you have a brief, sharp pain in your limbs. (2/4 - Medium DO)']
        - ['As though in response, you feel a deep pain in your chest\.', 'As though in response, you feel a deep pain in your chest. (3/4 - High DO. Slow down on DO generation.)']
        - ['The experience leaves you feeling naked for all to see\.', 'The experience leaves you feeling naked for all to see. (4/4 - Extreme DO. You are at risk of being smote. Stop generating DO!)']
        - ['((?:The back of your neck prickles|You feel judged and hated|Muddled thoughts of paranoia nag at you|You are exposed and vulnerable in this place|You have a feeling that you aren''t welcome here|You worry for your safety and well-being)\.)', '\1 (DO gained from being in a Holy area. Move away to avoid this hit.)']
        - ['(The experience leaves you feeling somehow exposed\.)', '\1 (Detectable by Moon Mages/Clerics - Use RoC/RoG with enough mana to mask it.)']
        - ['(Joyous corruption seeps into your mind from your own spell, muting your unconscious sense of shame\.)', '\1 (Your RoC/RoG spell is strong enough to mask your aura from Clerics and Moon Mages.)']
        - ['(You feel a wave of filth wash over you, heralding the renewed health of your internal gauges\.)', '\1 (You gained some Divine Outrage and your RoC/RoG spell is no longer strong enough to mask your aura from Clerics/Moon Mages. Recast with more mana.)']
