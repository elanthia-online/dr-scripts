# The text substitutions textsubs.lic applies to game lines, read with
# get_data('textsubs'). A copy in data/custom/base-textsubs.yaml replaces this
# file wholesale.
#
# Sections run in file order and subs in list order, and both orders matter:
# every sub that matches the original line applies, in this order, each to
# the output of the one before.
#
# Each sub is ['regex source', 'gsub replacement']. Keep every pattern and
# replacement in single quotes: inside them a backslash is literal (so '\1'
# stays a backreference and '\.' a literal dot) and a single quote is
# written twice (''). Double quotes would turn '\1' into a control byte.
#
# A section may have a when: gate, every key of which must hold:
#   guilds: ['Bard', 'Cleric']   the guild is one of these
#   not_guilds: ['Thief']        the guild is none of these
#   setting: 'herb_textsubs'     the setting is on
#   setting_off: 'herb_textsubs' the setting is off or unset
# Neither guild key holds while the guild is not known yet (DRStats has not
# read INFO); textsubs rebuilds its subs once it is.
# A section may have requires_any: ['Word', ...], words one of which a line
# must hold before its patterns run at all. It saves time and must never
# change a result, so list only words every pattern of the section needs.
# The guild_spells_link kind is the one sub that names the guild in its
# replacement: preresult, then a link to prelink + guild + poslink, then
# posresult. It gives no sub while the guild is not known.
#
# The ladder kind writes a scale of messages once: each step is
# [n, 'phrase'], and its sub matches the phrase and adds ' (n/of)' after it
# (style 'append', the default) or before the full stop it ends with (style
# 'before_period'). anchor: '^' goes before each phrase in the pattern only;
# prefix: 'text' goes before each phrase, with a space, in both. The phrase
# is the pattern as written and the replacement is its text with each
# backslash taken out, so write it as literal text: escape every regex
# metacharacter, and put a backslash before nothing but a punctuation mark.
# A '.' may stay unescaped, where it matches any character, but escape it
# (as the Osrel Meraud power steps do) when only the game's full stop
# should match; either way the replacement writes '.'. Leave the full
# stop out when the game may not send one (the Osrel Meraud capacity
# steps): the counter then goes straight after the phrase, so before the
# game's full stop if one follows it, or at the end of a line that ends
# there. Nothing ends the match after the phrase, so the counter goes
# before any other text that follows it too. Each n is from -of to of and
# used once on its scale.
# A scale split over ladder sections, around messages that stay pairs, gives
# each of them scale: 'name' and the same of; a scale is the section's own
# name otherwise. The load refuses a step whose text another step's
# pattern matches, or a pattern of another kind of section (a subs row,
# say), in its own section or any other in the file; and a step whose text
# ends with the start of another's, as 'a hit' and 'hit hard' in
# 'a hit hard', as one sub would then rewrite the line and the other lose
# its match. Two sections may share an n of one scale, or a phrase, only
# when no one guild passes both sections' when: gates; their setting keys
# are not read, so sections told apart only by settings are always checked
# against each other. A message that does not fit stays a pair in a subs
# section.
#
# Each spell is written once, in the spells: table at the end of the file:
#   name       the spell's name (regex source, as in a pattern)
#   guild      its guild, as DRStats names it
#   book       its spellbook
#   signature  true for a signature spell, else left out
#   tier       its recognition tier, such as 'basic'
#   type       its recognition type, such as 'augmentation/utility'
#   label      what its scroll label names, when that is neither the guild
#              nor the book
# Four kinds build their subs from texts, the table and templates:
#   wiki_links         an Elanthipedia link for each of texts, in order, with
#                      pretext, postext, prelink, poslink, preresult and
#                      posresult as TextSubs.elanthipedia takes them
#   spell_links        the same for every spell of the table, in table order
#   scroll_labels      a sub per name of names, {name} and {label} filled in
#                      the pattern and replacement; the label is the spell's
#                      label, else its guild, else its book
#   spell_recognition  a sub per group of groups, {names} being the names
#                      joined by '|' and {label} 'signature ' (for a signature
#                      spell), 'Guild (Book)' (or the book alone), ': ', the
#                      tier and the type; a group's names must share a label
# A name these sections list must be in the table, so a typo fails the load.
# A names entry written {name: '...', label: '...'} is an override, used as it
# is: it keeps a scroll label whose spelling differs from the table's.
textsubs:
  schema: 1
  sections:

    ### 1. Guild Spells ###
    - name: 'guild spell list link'
      when:
        setting: 'textsubs_spell_links'
      kind: 'guild_spells_link'
      pattern: 'You recall the spells you have learned from your training.'
      preresult: 'You recall the spells you have learned from your '
      prelink: 'Category:'
      poslink: '_spells'
      posresult: ' training.'

    ### 2. Magic Feats ###
    - name: 'magic feats link'
      when:
        setting: 'textsubs_spell_links'
      subs:
        - ['You recall proficiency with the magic feats of', 'You recall proficiency with the <a href="https://elanthipedia.play.net/Magical_feats">magic feats</a> of']

    ### 3. SPELLBOOKS ###
    # Each heading of the spells list links to its spellbook's category page.
    - name: 'spellbook links'
      when:
        setting: 'textsubs_spell_links'
      kind: 'wiki_links'
      pretext: '^'
      postext: ':'
      prelink: 'Category:'
      poslink: '_spellbook'
      texts:
        # Analagous Patterns
        - 'Analogous Patterns'
        # Bard Spellboooks
        - 'Elemental Invocations'
        - 'Emotion Control'
        - 'Fae Arts'
        - 'Sound Manipulation'
        # Cleric Spellbooks
        - 'Antinomic Sorcery'
        - 'Divine Intervention'
        - 'Holy Defense'
        - 'Holy Evocations'
        - 'Metamagic'
        - 'Spirit Manipulation'
        # Empath Spellbooks
        - 'Body Purification'
        - 'Healing'
        - 'Life Force Manipulation'
        - 'Mental Preparation'
        - 'Protection'
        # Moonmage Spellbooks
        - 'Enlightened Geometry'
        - 'Moonlight Manipulation'
        - 'Perception'
        - 'Psychic Projection'
        - 'Stellar Magic'
        - 'Teleologic Sorcery'
        # Necromanceer Spellbooks
        - 'Anabasis'
        - 'Animation'
        - 'Blood Magic'
        - 'Corruption'
        - 'Synthetic Creation'
        - 'Transcendental Necromancy'
        # Paladin Spellbooks
        - 'Inspiration'
        - 'Justice'
        - 'Sacrifice'
        # Ranger Spellbooks
        - 'Animal Abilities'
        - 'Nature Manipulation'
        - 'Wilderness Survival'
        # Warrior Mage Spellbooks
        - 'Aether Manipulation'
        - 'Air Manipulation'
        - 'Earth Manipulation'
        - 'Electricity Manipulation'
        - 'Fire Manipulation'
        - 'Hylomorphic Sorcery'
        - 'Water Manipulation'

    ### 4. SPELLS ###
    # Each spell of the spells table, at the end of this file, links to its page, in table order.
    - name: 'spell links'
      when:
        setting: 'textsubs_spell_links'
      kind: 'spell_links'
      pretext: '........\s\s|\S|^'
      postext: '..\(.*\)|\s*Slot'

    ### TEACHING CLASSES - MikeLC 2/15/2025 ###
    - name: 'teaching classes'
      subs:
        - ['class on extremely advanced(.*)compared to', 'teaching a class on extremely advanced\1more than 130% of']
        - ['class on advanced(.*)compared to', 'teaching a class on advanced\1around 120-130% of']
        - ['class on intermediate(.*)compared to', 'teaching a class on intermediate\1around 110-120% of']
        - ['class on basic(.*)compared to', 'teaching a class on basic\1around 100-110% of']
        - ['class on simplistic(.*)compared to', 'teaching a class on simplistic\1around 90-100% of']
        - ['class on extremely simplistic(.*)compared to', 'teaching a class on extremely simplistic\1less than 90% of']

    # Necromancer Butchery
    - name: 'Necromancer butchery'
      when:
        guilds: ['Necromancer']
      kind: 'ladder'
      prefix: 'manage to extract a'
      of: 10
      steps:
        - [10, 'perfect']
        - [9, 'flawless']
        - [8, 'superior']
        - [7, 'very good']
        - [6, 'decent']
        - [5, 'fair']
        - [4, 'mediocre']
        - [3, 'passable']
        - [2, 'shoddy']
        - [1, 'poor']

    # Bard play and dance assessment (the song ladder is the later Bard block)
    - name: 'Bard play assessment'
      when:
        guilds: ['Bard']
      kind: 'ladder'
      of: 10
      steps:
        - [1, 'the simplest musical phrase in your current state of mind.']
        - [2, 'feel very sure of your ability to perform just now.']
        - [3, 'you give up in exasperation and stop trying to play altogether.']
        - [4, 'you realize that you''re not quite up to a true performance.']
        - [5, 'produced from your efforts is both clear and precise.']
        - [6, 'displaying the surety you hold in your ability to perform.']
        - [7, 'adeptness with which you perform your craft is evident in each movement.']
        - [8, 'skill and confidence of one talented in their craft.']
        - [9, 'evocative rhythms you send to float gently upon the air.']
        - [10, 'Leth Deriel during the full throes of Spring.']

    - name: 'Bard dance assessment'
      when:
        guilds: ['Bard']
      kind: 'ladder'
      of: 10
      steps:
        - [1, 'you decide not to attempt that again, and get back to your feet.']
        - [2, 'but decide that now may not be the best time for dancing.']
        - [3, 'You can''t seem to recall what to do next, despite your best efforts.']
        - [4, 'entirety of the dance without too much trouble.']
        - [5, 'dance flawlessly, wrapping up with a flourish.']
        - [6, 'leave you breathless, you wrap up with a flourish.']
        - [7, 'reaches its conclusion, a grin lights up your face.']
        - [8, 'and when they finally come to rest again, you cannot help but smile.']
        - [9, 'When you finally come to rest again, you are still smiling.']
        - [10, 'you wrap up with a flourish and pose, a wide smile upon your face.']

