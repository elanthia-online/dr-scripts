    # Bard song assessment: one key per whole message, so each gets one counter
    - name: 'Bard song assessment, stopped after the first lines'
      when:
        guilds: ['Bard']
      subs:
        - ['You stop only after those first few lines, however, unable to remember any more\.', 'You stop only after those first few lines, however, unable to remember any more (1/7).']

    - name: 'Bard song assessment'
      when:
        guilds: ['Bard']
      kind: 'ladder'
      style: 'before_period'
      of: 7
      steps:
        - [1, 'Your voice cracks on the second line, however, and you stop, unable to remember any more of the song anyway\.']
        - [2, 'At one point you hesitate as you mentally grasp for the next line of the song, and stop in confusion, but pick it up a moment later and bring it to a strong conclusion\.']
        - [3, 'You feel a bit tired as you finish, but grin despite that for the ease at which you sang\.']
        - [4, 'You bring the song to a close, bowing your head\.']

    - name: 'Bard song assessment, the top three steps'
      when:
        guilds: ['Bard']
      subs:
        # The message names the song's language; the key takes any language name
        # spelled with letters, apostrophes, hyphens and spaces (S'Kra Mur)
        - ['(Your voice carries strongly on the air as you effortlessly recite the [A-Za-z'' -]+ words so that all may hear, bowing your head as they come to a close)\.', '\1 (5/7).']
        - ['Tears fill your eyes as the emotion of your ancient aire grips you, and you raise your chin with pride as it comes to a close\.', 'Tears fill your eyes as the emotion of your ancient aire grips you, and you raise your chin with pride as it comes to a close (6/7).']
        - ['When the song finally comes to a close, you bow your head, your ears ringing in the silence\.', 'When the song finally comes to a close, you bow your head, your ears ringing in the silence (7/7).']

