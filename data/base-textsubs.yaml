# The text substitutions textsubs.lic applies to game lines, read with
# get_data('textsubs'). A copy in data/custom/base-textsubs.yaml replaces this
# file wholesale.
#
# Sections run in file order and subs in list order, and both orders matter:
# every sub that matches the original line applies, in this order, each to
# the output of the one before.
#
# Each sub is ['regex source', 'gsub replacement']. Keep every pattern and
# replacement in single quotes: inside them a backslash is literal (so '\1'
# stays a backreference and '\.' a literal dot) and a single quote is
# written twice (''). Double quotes would turn '\1' into a control byte.
#
# A section may have a when: gate, every key of which must hold:
#   guilds: ['Bard', 'Cleric']   the guild is one of these
#   not_guilds: ['Thief']        the guild is none of these
#   setting: 'herb_textsubs'     the setting is on
#   setting_off: 'herb_textsubs' the setting is off or unset
# A section may have requires_any: ['Word', ...], words one of which a line
# must hold before its patterns run at all. It saves time and must never
# change a result, so list only words every pattern of the section needs.
# The guild_spells_link kind is the one sub that names the guild in its
# replacement: preresult, then a link to prelink + guild + poslink, then
# posresult.
textsubs:
  schema: 1
  sections:

    ### 1. Guild Spells ###
    - name: 'guild spell list link'
      when:
        setting: 'textsubs_spell_links'
      kind: 'guild_spells_link'
      pattern: 'You recall the spells you have learned from your training.'
      preresult: 'You recall the spells you have learned from your '
      prelink: 'Category:'
      poslink: '_spells'
      posresult: ' training.'

    ### 2. Magic Feats ###
    - name: 'spellbook and spell links'
      when:
        setting: 'textsubs_spell_links'
      subs:
        - ['You recall proficiency with the magic feats of', 'You recall proficiency with the <a href="https://elanthipedia.play.net/Magical_feats">magic feats</a> of']
