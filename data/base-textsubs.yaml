# The text substitutions textsubs.lic applies to game lines, read with
# get_data('textsubs'). A copy in data/custom/base-textsubs.yaml replaces this
# file wholesale.
#
# Sections run in file order and subs in list order, and both orders matter:
# every sub that matches the original line applies, in this order, each to
# the output of the one before.
#
# Each sub is ['regex source', 'gsub replacement']. Keep every pattern and
# replacement in single quotes: inside them a backslash is literal (so '\1'
# stays a backreference and '\.' a literal dot) and a single quote is
# written twice (''). Double quotes would turn '\1' into a control byte.
#
# A section may have a when: gate, every key of which must hold:
#   guilds: ['Bard', 'Cleric']   the guild is one of these
#   not_guilds: ['Thief']        the guild is none of these
#   setting: 'herb_textsubs'     the setting is on
#   setting_off: 'herb_textsubs' the setting is off or unset
# Neither guild key holds while the guild is not known yet (DRStats has not
# read INFO); textsubs rebuilds its subs once it is.
# A section may have requires_any: ['Word', ...], words one of which a line
# must hold before its patterns run at all. It saves time and must never
# change a result, so list only words every pattern of the section needs.
# The guild_spells_link kind is the one sub that names the guild in its
# replacement: preresult, then a link to prelink + guild + poslink, then
# posresult. It gives no sub while the guild is not known.
#
# Each spell is written once, in the spells: table at the end of the file:
#   name       the spell's name (regex source, as in a pattern)
#   guild      its guild, as DRStats names it
#   book       its spellbook
#   signature  true for a signature spell, else left out
#   tier       its recognition tier, such as 'basic'
#   type       its recognition type, such as 'augmentation/utility'
#   label      what its scroll label names, when that is neither the guild
#              nor the book
# Four kinds build their subs from texts, the table and templates:
#   wiki_links         an Elanthipedia link for each of texts, in order, with
#                      pretext, postext, prelink, poslink, preresult and
#                      posresult as TextSubs.elanthipedia takes them
#   spell_links        the same for every spell of the table, in table order
#   scroll_labels      a sub per name of names, {name} and {label} filled in
#                      the pattern and replacement; the label is the spell's
#                      label, else its guild, else its book
#   spell_recognition  a sub per group of groups, {names} being the names
#                      joined by '|' and {label} 'signature ' (for a signature
#                      spell), 'Guild (Book)' (or the book alone), ': ', the
#                      tier and the type; a group's names must share a label
# A name these sections list must be in the table, so a typo fails the load.
# A names entry written {name: '...', label: '...'} is an override, used as it
# is: it keeps a scroll label whose spelling differs from the table's.
textsubs:
  schema: 1
  sections:

    ### 1. Guild Spells ###
    - name: 'guild spell list link'
      when:
        setting: 'textsubs_spell_links'
      kind: 'guild_spells_link'
      pattern: 'You recall the spells you have learned from your training.'
      preresult: 'You recall the spells you have learned from your '
      prelink: 'Category:'
      poslink: '_spells'
      posresult: ' training.'

    ### 2. Magic Feats ###
    - name: 'magic feats link'
      when:
        setting: 'textsubs_spell_links'
      subs:
        - ['You recall proficiency with the magic feats of', 'You recall proficiency with the <a href="https://elanthipedia.play.net/Magical_feats">magic feats</a> of']

    ### 3. SPELLBOOKS ###
    # Each heading of the spells list links to its spellbook's category page.
    - name: 'spellbook links'
      when:
        setting: 'textsubs_spell_links'
      kind: 'wiki_links'
      pretext: '^'
      postext: ':'
      prelink: 'Category:'
      poslink: '_spellbook'
      texts:
        # Analagous Patterns
        - 'Analogous Patterns'
        # Bard Spellboooks
        - 'Elemental Invocations'
        - 'Emotion Control'
        - 'Fae Arts'
        - 'Sound Manipulation'
        # Cleric Spellbooks
        - 'Antinomic Sorcery'
        - 'Divine Intervention'
        - 'Holy Defense'
        - 'Holy Evocations'
        - 'Metamagic'
        - 'Spirit Manipulation'
        # Empath Spellbooks
        - 'Body Purification'
        - 'Healing'
        - 'Life Force Manipulation'
        - 'Mental Preparation'
        - 'Protection'
        # Moonmage Spellbooks
        - 'Enlightened Geometry'
        - 'Moonlight Manipulation'
        - 'Perception'
        - 'Psychic Projection'
        - 'Stellar Magic'
        - 'Teleologic Sorcery'
        # Necromanceer Spellbooks
        - 'Anabasis'
        - 'Animation'
        - 'Blood Magic'
        - 'Corruption'
        - 'Synthetic Creation'
        - 'Transcendental Necromancy'
        # Paladin Spellbooks
        - 'Inspiration'
        - 'Justice'
        - 'Sacrifice'
        # Ranger Spellbooks
        - 'Animal Abilities'
        - 'Nature Manipulation'
        - 'Wilderness Survival'
        # Warrior Mage Spellbooks
        - 'Aether Manipulation'
        - 'Air Manipulation'
        - 'Earth Manipulation'
        - 'Electricity Manipulation'
        - 'Fire Manipulation'
        - 'Hylomorphic Sorcery'
        - 'Water Manipulation'

    ### 4. SPELLS ###
    # Each spell of the spells table, at the end of this file, links to its page, in table order.
    - name: 'spell links'
      when:
        setting: 'textsubs_spell_links'
      kind: 'spell_links'
      pretext: '........\s\s|\S|^'
      postext: '..\(.*\)|\s*Slot'

    ### TEACHING CLASSES - MikeLC 2/15/2025 ###
