# Word data for aesthene.lic (Aesthene's Close time-lock puzzle).
#
# lock_answers: words known to be time-lock answers. The solver narrows
#   these first. Characters can append their own with the
#   `aesthene_lock_answers` setting (see profiles/base.yaml).
# dictionary: general five-letter words. The solver uses them to choose
#   guesses, but only treats one as a possible answer once lock feedback rules
#   out every known answer. Kept disjoint from lock_answers.
#
# opening: the solver's first guess for an empty lock. Computing it scores
#   every answer against thousands of guesses (several seconds), so it is
#   stored here. spec/aesthene_spec.rb fails if it no longer matches what the
#   solver computes from these lists.
#
# Entries are five ASCII letters; the script upcases and validates on load,
# so case does not matter.
