name: Rubocop
on:
  push:
    branches: 
      - 'main'
    paths:
      - "**.lic"
      - "**.rb"
      - "bin/**"
      - "Gemfile"
      - ".rubocop.yml"
      - ".rubocop/**"
      - ".github/workflows/rubocop.yml"
  pull_request:
    paths:
      - "**.lic"
      - "**.rb"
      - "bin/**"
      - "Gemfile"
      - ".rubocop.yml"
      - ".rubocop/**"
      - ".github/workflows/rubocop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: 'gtk:vscode:profanity'
    strategy:
      matrix:
        ruby: ['4.0']
    name: Run Rubocop on Ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Lint the whole repo, not just changed files: with rubocop pinned in the
      # Gemfile, main stays clean and a PR only fails on offenses it introduces.
      - name: Rubocop
        run: bundle exec rubocop
